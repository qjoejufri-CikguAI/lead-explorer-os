<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Leads - TikTok</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; padding-top: 40px; }
        .container { max-width: 1200px; }
        .table-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); padding: 25px; margin-top: 30px; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .data-count { color: #6c757d; font-size: 0.9rem; margin-bottom: 20px; }
        .status-message { margin-top: 10px; padding: 10px; border-radius: 4px; }
        .context-cell { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
<div id="authOverlay" style="display:flex; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:99999; align-items:center; justify-content:center;">
  <div style="background:#fff; max-width:400px; width:90%; padding:40px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.3); text-align:center;">
    <h2 style="margin-top:0;">🔐 Staff Login</h2>
    <input type="password" id="passwordInput" placeholder="Masukkan Password" style="width:100%; padding:12px; margin-bottom:16px; font-size:1rem; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
    <button id="loginBtn" style="width:100%; padding:12px; background:#0d6efd; color:#fff; border:none; border-radius:6px; font-size:1rem; cursor:pointer;">Masuk</button>
    <p id="loginError" style="color:red; display:none; margin-top:12px; font-size:0.9rem;">Password Salah!</p>
  </div>
</div>
<div id="staffWrap" style="display:none;">
<div class="container">
    <div class="text-center mb-4">
        <h1>Staff Leads - TikTok</h1>
        <div class="data-count" id="totalLeadsCount">Total Leads: 0</div>
    </div>

    <div class="text-center mb-3">
        <button id="downloadCsvBtn" class="btn btn-outline-primary">⬇️ Muat Turun CSV</button>
    </div>

    <div class="status-message" id="statusMessage"></div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>Niche</th>
                        <th>Konteks / Komen</th>
                        <th>Tarikh</th>
                        <th>Link Profil TikTok</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { supabaseClient } from './src/supabaseClient.js';

function openProfile(url) {
    if (!url) { alert('Tiada link profil.'); return; }
    window.open(url, '_blank');
  }

  const tbody = document.getElementById('leadsTableBody');
  const statusDiv = document.getElementById('statusMessage');

  async function fetchLeads() {
    statusDiv.textContent = 'Memuatkan prospek dari Supabase...';
    const { data, error } = await supabaseClient.from('leads').select('*').ilike('platform', '%tiktok%').order('id', { ascending: true });
    if (error) {
      statusDiv.textContent = 'Ralat memuatkan prospek: ' + error.message;
      return;
    }
    window.leadsData = data || [];
    renderLeads(window.leadsData);
    const count = (data || []).length;
    document.getElementById('totalLeadsCount').textContent = 'Total Leads: ' + count;
    statusDiv.textContent = 'Dimuatkan ' + count + ' prospek dari Supabase.';
  }
  window.fetchLeads = fetchLeads;

  function renderLeads(leads) {
    tbody.innerHTML = '';
    const sorted = [...leads].sort((a, b) => (b.intent_score || 0) - (a.intent_score || 0));
    sorted.forEach(lead => {
      const tr = document.createElement('tr');
      tr.dataset.phone = lead.phone || '';
      tr.dataset.email = lead.email || '';
      tr.dataset.socialLink = lead.social_link || lead.profile_url || '';
      const profileUrl = lead.social_link || `https://www.tiktok.com/@${lead.name}`;
      const createdAt = lead.created_at ? new Date(lead.created_at).toLocaleString('ms-MY') : '';
      tr.innerHTML = '<td>' + lead.id + '</td><td>' + lead.name + '</td><td>' + lead.niche + '</td><td class="context-cell">' + (lead.context || lead.comment || '') + '</td><td>' + createdAt + '</td><td><button class="btn btn-sm btn-outline-primary" onclick="openProfile(\'' + profileUrl.replace(/'/g, "\\'") + '\')" title="Buka Profil TikTok">🔗 Profil</button></td>';
      tbody.appendChild(tr);
    });
  }

  document.getElementById('downloadCsvBtn')?.addEventListener('click', function () {
    const leads = window.leadsData || [];
    if (leads.length === 0) {
      alert('Tiada data untuk muat turun.');
      return;
    }
    const headers = ['ID','Nama','Niche','Konteks','Tarikh','Link Profil TikTok'];
    const rows = leads.map(lead => {
      const profileUrl = lead.social_link || `https://www.tiktok.com/@${lead.name}`;
      const createdAt = lead.created_at ? new Date(lead.created_at).toLocaleString('ms-MY') : '';
      return [lead.id, lead.name, lead.niche, (lead.context || lead.comment || ''), createdAt, profileUrl];
    });
    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
      csv += row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', 'tiktok_leads_staff.csv');
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  // ==================== AUTHENTICATION ====================
  const CORRECT_PASSWORD = "mayang2026";
  const authOverlay = document.getElementById('authOverlay');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const staffWrap = document.getElementById('staffWrap');

  function checkAuth() {
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      authOverlay.style.display = 'none';
      staffWrap.style.display = 'block';
    } else {
      authOverlay.style.display = 'flex';
      staffWrap.style.display = 'none';
    }
  }

  checkAuth();

  loginBtn?.addEventListener('click', function () {
    if (passwordInput.value === CORRECT_PASSWORD) {
      sessionStorage.setItem('isLoggedIn', 'true');
      authOverlay.style.display = 'none';
      loginError.style.display = 'none';
      staffWrap.style.display = 'block';
      passwordInput.value = '';
    } else {
      loginError.style.display = 'block';
      passwordInput.value = '';
      passwordInput.focus();
    }
  });

  passwordInput?.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      loginBtn.click();
    }
  });

  fetchLeads();
</script>
</body>
</html>
