<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Leads - Lead Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; padding-top: 40px; }
        .container { max-width: 1200px; }
        .table-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); padding: 25px; margin-top: 30px; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .data-count { color: #6c757d; font-size: 0.9rem; margin-bottom: 20px; }
        .context-cell { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-4">
        <h1>📋 Staff Leads (Read-Only)</h1>
        <div class="data-count" id="totalLeadsCount">Memuatkan...</div>
    </div>

    <div class="text-center mb-3">
        <a href="tiktok.html" class="btn btn-secondary">Kembali ke Dashboard Utama</a>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>Niche</th>
                        <th>Konteks / Komen</th>
                        <th>Skor Niat</th>
                        <th>Taraf</th>
                        <th>Tarikh</th>
                        <th>Profil TikTok</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody"></tbody>
            </table>
        </div>

        <div class="text-end mt-3">
            <button class="btn btn-primary" onclick="downloadCSV()">
                📥 Muat Turun CSV
            </button>
        </div>
    </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL = 'https://ypcccthqbnkurkslsvdi.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_psEsjDPRCqYEencypzNW9g_NgRW7ZPj';
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const tbody = document.getElementById('leadsTableBody');
  const countEl = document.getElementById('totalLeadsCount');

  async function fetchLeads() {
    const { data, error } = await supabaseClient
      .from('leads')
      .select('*')
      .eq('platform', 'TikTok')
      .order('id', { ascending: false });

    if (error) {
      countEl.textContent = 'Ralat: ' + error.message;
      return;
    }

    countEl.textContent = 'Jumlah Leads: ' + (data || []).length;
    renderLeads(data || []);
  }

  const LEVEL_ORDER = { 'Super Hot': 0, 'Hot': 1, 'Warm': 2, 'Cold': 3 };

  function getLevel(score) {
    if (score >= 0.8) return 'Super Hot';
    if (score >= 0.6) return 'Hot';
    if (score >= 0.4) return 'Warm';
    return 'Cold';
  }

  function renderLeads(leads) {
    tbody.innerHTML = '';

    const sorted = [...leads].sort((a, b) => {
      const scoreA = parseFloat(a.intent_score) || 0;
      const scoreB = parseFloat(b.intent_score) || 0;
      const levelA = getLevel(scoreA);
      const levelB = getLevel(scoreB);
      const levelDiff = LEVEL_ORDER[levelA] - LEVEL_ORDER[levelB];
      if (levelDiff !== 0) return levelDiff;
      return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    });

    sorted.forEach(lead => {
      const score = parseFloat(lead.intent_score) || 0;
      const label = getLevel(score);
      const cls = score >= 0.8 ? 'text-danger' : score >= 0.6 ? 'text-warning' : score >= 0.4 ? 'text-info' : 'text-muted';
      const date = lead.created_at ? new Date(lead.created_at).toLocaleString('ms-MY') : '';
      const profileUrl = lead.social_link || `https://www.tiktok.com/@${lead.name}`;

      tbody.innerHTML += `
        <tr>
          <td>${lead.id}</td>
          <td>${lead.name}</td>
          <td>${lead.niche}</td>
          <td class="context-cell">${lead.context || ''}</td>
          <td>${lead.intent_score}</td>
          <td class="${cls}">${label}</td>
          <td>${date}</td>
          <td><a href="${profileUrl}" target="_blank" class="btn btn-sm btn-dark">Buka Profil</a></td>
        </tr>
      `;
    });
  }

  function downloadCSV() {
    const rows = [];
    const headers = ['ID','Nama','Niche','Konteks','Skor','Taraf','Tarikh','Profil TikTok'];
    rows.push(headers.join(','));

    const tableRows = tbody.querySelectorAll('tr');
    tableRows.forEach(tr => {
      const cols = tr.querySelectorAll('td');
      const vals = Array.from(cols).map(c => '"' + c.textContent.replace(/"/g, '""') + '"');
      rows.push(vals.join(','));
    });

    const csvContent = rows.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', 'staff_leads.csv');
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  fetchLeads();
</script>
</body>
</html>
