<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Explorer - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; padding-top: 40px; }
        .container { max-width: 1200px; }
        .table-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); padding: 25px; margin-top: 30px; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .data-count { color: #6c757d; font-size: 0.9rem; margin-bottom: 20px; }
        .search-form { margin-bottom: 15px; padding: 15px; background: #f1f3f5; border-radius: 8px; }
        .status-message { margin-top: 10px; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-4">
        <h1>Lead Explorer Dashboard</h1>
        <div class="data-count" id="totalLeadsCount">Total Leads: 5</div>
    </div>

    <form id="filterForm" class="search-form">
        <div class="row g-3">
            <div class="col-md-4">
                <select class="form-select" id="nicheFilter">
                    <option value="">Semua Niche</option>
                    <option value="Jualan Kereta">Jualan Kereta</option>
                    <option value="Servis Bengkel">Servis Bengkel</option>
                    <option value="Aksesori Kereta">Aksesori Kereta</option>
                </select>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="areaFilter">
                    <option value="">Semua Kawasan</option>
                    <option value="Kuala Lumpur">Wilayah Persekutuan Kuala Lumpur</option>
                    <option value="Putrajaya">Wilayah Persekutuan Putrajaya</option>
                    <option value="Labuan">Wilayah Persekutuan Labuan</option>
                    <option value="Petaling Jaya">Selangor - Petaling Jaya</option>
                    <option value="Shah Alam">Selangor - Shah Alam</option>
                    <option value="Klang">Selangor - Klang</option>
                    <option value="Subang Jaya">Selangor - Subang Jaya</option>
                    <option value="Gombak">Selangor - Gombak</option>
                    <option value="Hulu Langat">Selangor - Hulu Langat</option>
                    <option value="Sungai Buloh">Selangor - Sungai Buloh</option>
                    <option value="Rawang">Selangor - Rawang</option>
                    <option value="Muar">Johor - Muar</option>
                    <option value="Tangkak">Johor - Tangkak</option>
                    <option value="Batu Pahat">Johor - Batu Pahat</option>
                    <option value="Kluang">Johor - Kluang</option>
                    <option value="Johor Bahru">Johor - Johor Bahru</option>
                    <option value="Segamat">Johor - Segamat</option>
                    <option value="Pontian">Johor - Pontian</option>
                    <option value="Kota Tinggi">Johor - Kota Tinggi</option>
                    <option value="Mersing">Johor - Mersing</option>
                    <option value="Kulai">Johor - Kulai</option>
                    <option value="Seremban">Negeri Sembilan - Seremban</option>
                    <option value="Nilai">Negeri Sembilan - Nilai</option>
                    <option value="Bahau">Negeri Sembilan - Bahau</option>
                    <option value="Gemas">Negeri Sembilan - Gemas</option>
                    <option value="Ayer Hitam">Negeri Sembilan - Ayer Hitam</option>
                    <option value="Kuantan">Pahang - Kuantan</option>
                    <option value="Gambang">Pahang - Gambang</option>
                    <option value="Temerloh">Pahang - Temerloh</option>
                    <option value="Bandar Muadzam Shah">Pahang - Bandar Muadzam Shah</option>
                    <option value="Ipoh">Perak - Ipoh</option>
                    <option value="Taiping">Perak - Taiping</option>
                    <option value="Cameron Highlands">Perak - Cameron Highlands</option>
                    <option value="Gopeng">Perak - Gopeng</option>
                    <option value="Teluk Intan">Perak - Teluk Intan</option>
                    <option value="Padang Rengas">Perak - Padang Rengas</option>
                    <option value="Kangar">Perlis - Kangar</option>
                    <option value="Padang Serai">Perlis - Padang Serai</option>
                    <option value="Arau">Perlis - Arau</option>
                    <option value="Simpang Empat">Perlis - Simpang Empat</option>
                    <option value="George Town">Penang - George Town</option>
                    <option value="Butterworth">Penang - Butterworth</option>
                    <option value="Bayan Lepas">Penang - Bayan Lepas</option>
                    <option value="Kota Kinabalu">Sabah - Kota Kinabalu</option>
                    <option value="Sandakan">Sabah - Sandakan</option>
                    <option value="Likas">Sabah - Likas</option>
                    <option value="Papar">Sabah - Papar</option>
                    <option value="Ranau">Sabah - Ranau</option>
                    <option value="Penampang">Sabah - Penampang</option>
                    <option value="Kuching">Sarawak - Kuching</option>
                    <option value="Sibu">Sarawak - Sibu</option>
                    <option value="Miri">Sarawak - Miri</option>
                    <option value="Bintulu">Sarawak - Bintulu</option>
                    <option value="Kuala Terengganu">Terengganu - Kuala Terengganu</option>
                    <option value="Kuala Berang">Terengganu - Kuala Berang</option>
                    <option value="Hulu Terengganu">Terengganu - Hulu Terengganu</option>
                    <option value="Setiu">Terengganu - Setiu</option>
                </select>
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" id="subjectFilter" placeholder="Cari Nama, Niche, Daerah atau Kata Kunci">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Apply Filters</button>
                <button type="reset" class="btn btn-outline-secondary">Reset</button>
                <button id="runScoutBtn" class="btn btn-success ms-2" type="button">Run Scout Agent</button>
            </div>
        </div>
    </form>
    <div class="status-message" id="statusMessage"></div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Niche</th>
                        <th>Area</th>
                        <th>Intent Score</th>
                        <th>Interest Level</th>
                        <th>Tindakan</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { supabaseClient } from './src/supabaseClient.js';
  import { runScoutAgent } from './src/scoutAgent.js';

function openWhatsApp(btn) {
    const phone = btn.closest('tr').dataset.phone;
    if (!phone) {
        alert('Nombor telefon tiada untuk lead ni.');
        return;
    }
    window.open('https://wa.me/' + phone, '_blank');
}

function openCall(btn) {
    const phone = btn.closest('tr').dataset.phone;
    if (!phone) { alert('Tiada nombor telefon.'); return; }
    window.location.href = 'tel:' + phone;
}

function copyPhone(btn) {
    const phone = btn.closest('tr').dataset.phone;
    if (!phone) return;
    navigator.clipboard.writeText(phone).then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '✅';
        setTimeout(() => { btn.innerHTML = original; }, 1500);
    });
}

function openEmail(btn) {
    const tr = btn.closest('tr');
    const email = tr.dataset.email || '';
    if (!email) { alert('Tiada email untuk lead ini.'); return; }
    window.location.href = 'mailto:' + email;
}

function openDM(btn) {
    const tr = btn.closest('tr');
    const url = tr.dataset.socialLink || tr.dataset.profileUrl || '';
    if (!url) { alert('Tiada link profil untuk lead ini.'); return; }
    window.open(url, '_blank');
}

  const tbody = document.getElementById('leadsTableBody');
  const form = document.getElementById('filterForm');
  const statusDiv = document.getElementById('statusMessage');

  async function fetchLeads() {
    statusDiv.textContent = 'Memuatkan prospek dari Supabase...';
    const { data, error } = await supabaseClient.from('leads').select('*').order('id', { ascending: true });
    if (error) {
      statusDiv.textContent = 'Ralat memuatkan prospek: ' + error.message;
      return;
    }
    renderLeads(data || []);
    const count = (data || []).length;
    document.getElementById('totalLeadsCount').textContent = 'Total Leads: ' + count;
    console.log('Data dari Supabase:', data);
    statusDiv.textContent = 'Dimuatkan ' + count + ' prospek dari Supabase.';
  }
  window.fetchLeads = fetchLeads;

  function renderLeads(leads) {
    tbody.innerHTML = '';
    leads.forEach(lead => {
      const tr = document.createElement('tr');
      tr.dataset.phone = lead.phone || '';
      tr.dataset.email = lead.email || '';
      tr.dataset.socialLink = lead.social_link || lead.profile_url || '';
      const interestClass = lead.interest_level === 'Hot' ? 'text-danger' : lead.interest_level === 'Warm' ? 'text-warning' : 'text-muted';
      const emailDisabled = !lead.email ? 'disabled' : '';
      const dmDisabled = (!lead.social_link && !lead.profile_url) ? 'disabled' : '';
      tr.innerHTML = '<td>' + lead.id + '</td><td>' + lead.name + '</td><td>' + lead.niche + '</td><td>' + lead.area + '</td><td>' + lead.intent_score + '</td><td class="' + interestClass + '">' + lead.interest_level + '</td><td><div class="d-flex gap-1"><button type="button" class="btn btn-sm btn-success" onclick="openWhatsApp(this)" title="WhatsApp">📱</button><button type="button" class="btn btn-sm btn-outline-primary" onclick="openCall(this)" title="Call">📞</button><button type="button" class="btn btn-sm btn-outline-secondary" onclick="copyPhone(this)" title="Copy">📋</button><button type="button" class="btn btn-sm btn-outline-danger" onclick="openEmail(this)" title="Email" ' + emailDisabled + '>✉️</button><button type="button" class="btn btn-sm btn-outline-info" onclick="openDM(this)" title="DM/Profil" ' + dmDisabled + '>🔗</button></div></td>';
      tbody.appendChild(tr);
    });
  }

  function filterRows() {
    const nicheVal = document.getElementById('nicheFilter').value.trim().toLowerCase();
    const areaVal = document.getElementById('areaFilter').value.trim().toLowerCase();
    const subjectVal = document.getElementById('subjectFilter').value.trim().toLowerCase();
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(row => {
      const name = row.cells[1].textContent.trim().toLowerCase();
      const niche = row.cells[2].textContent.trim().toLowerCase();
      const area = row.cells[3].textContent.trim().toLowerCase();
      const nicheMatch = !nicheVal || niche.includes(nicheVal);
      const areaMatch = !areaVal || area.includes(areaVal);
      const subjectMatch = !subjectVal || (name + ' ' + niche + ' ' + area).includes(subjectVal);
      row.style.display = (nicheMatch && areaMatch && subjectMatch) ? '' : 'none';
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    filterRows();
  });

  form.addEventListener('reset', function () {
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(row => { row.style.display = ''; });
    statusDiv.textContent = '';
  });

  document.getElementById('runScoutBtn')?.addEventListener('click', runScoutAgent);

  fetchLeads();
</script>
</body>
</html>
