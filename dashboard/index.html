<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; }
        .auth-card { background: #fff; max-width: 420px; width: 92%; padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); text-align: center; }
        .brand { font-size: 2rem; font-weight: 800; color: #0d6efd; margin-bottom: 8px; letter-spacing: -0.5px; }
        .subtitle { color: #6c757d; font-size: 0.95rem; margin-bottom: 28px; }
        .form-control { padding: 14px; font-size: 1rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 14px; background: #0d6efd; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-login:hover { background: #0b5ed7; }
        #loginError { color: #dc3545; display: none; margin-top: 12px; font-size: 0.9rem; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 30px; }
        .dash-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px 16px; border-radius: 12px; text-decoration: none; font-size: 1.15rem; font-weight: 600; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.15); transition: transform 0.15s, box-shadow 0.15s; border: none; cursor: pointer; }
        .dash-btn:active { transform: scale(0.98); }
        .dash-tiktok { background: linear-gradient(135deg, #000000 0%, #262626 100%); }
        .dash-facebook { background: linear-gradient(135deg, #1877f2 0%, #0d5fb8 100%); }
        .dash-icon { font-size: 1.6rem; }
    </style>
</head>
<body>
<div id="authOverlay" style="display:flex; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:99999; align-items:center; justify-content:center;">
  <div class="auth-card">
    <div class="brand">🔐 Lead Explorer</div>
    <div class="subtitle">Masukkan laluan untuk melanjutkan</div>
    <input type="password" id="passwordInput" placeholder="Masukkan Password" class="form-control">
    <div id="loginError" style="color:red; display:none; margin-top:12px; font-size:0.9rem;">Password Salah!</div>
    <button id="loginBtn" class="btn-login">Masuk</button>
  </div>
</div>

<div id="dashboardWrap" style="display:none; text-align:center; padding: 40px 20px; max-width: 600px; width: 100%;">
    <div class="brand" style="color:#fff; margin-bottom: 6px;">Lead Explorer</div>
    <div class="subtitle" style="color:#e9ecef; margin-bottom: 30px;">Pilih platform untuk memulakanDashboard</div>

    <div class="dashboard-grid">
        <button class="dash-btn dash-tiktok" onclick="location.href='tiktok.html'">
            <span class="dash-icon">🎵</span>
            Masuk Dashboard TikTok
        </button>
        <button class="dash-btn dash-facebook" onclick="location.href='facebook.html'">
            <span class="dash-icon">📘</span>
            Masuk Dashboard Facebook
        </button>
    </div>
</div>

<script>
  const CORRECT_PASSWORD = "mayang2026";
  const authOverlay = document.getElementById('authOverlay');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const dashboardWrap = document.getElementById('dashboardWrap');

  function checkAuth() {
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      authOverlay.style.display = 'none';
      dashboardWrap.style.display = 'block';
    } else {
      authOverlay.style.display = 'flex';
      dashboardWrap.style.display = 'none';
    }
  }

  checkAuth();

  loginBtn?.addEventListener('click', function () {
    if (passwordInput.value === CORRECT_PASSWORD) {
      sessionStorage.setItem('isLoggedIn', 'true');
      authOverlay.style.display = 'none';
      loginError.style.display = 'none';
      dashboardWrap.style.display = 'block';
      passwordInput.value = '';
    } else {
      loginError.style.display = 'block';
      passwordInput.value = '';
      passwordInput.focus();
    }
  });

  passwordInput?.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      loginBtn.click();
    }
  });
</script>
</body>
</html>
